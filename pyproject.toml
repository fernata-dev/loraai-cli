[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraai-cli"
version = "1.0.0"
description = "Text forensics, hidden-Unicode detection, AI-writing analysis and humanization toolkit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "loraai-cli contributors" }]
keywords = [
    "text-forensics", "unicode", "ai-detection", "stylometry",
    "watermark", "humanizer", "tui", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "textual>=0.60",
    "click>=8.1",
    # tomllib entered the standard library in 3.11; tomli is its backport.
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
llm = ["httpx>=0.24"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0"]

[project.scripts]
loraai = "loraai.cli.main:main"
lora = "loraai.cli.main:main"

[project.urls]
Homepage = "https://github.com/procp039-pixel/loraai-cli"
Repository = "https://github.com/procp039-pixel/loraai-cli"
Issues = "https://github.com/procp039-pixel/loraai-cli/issues"

[tool.setuptools.packages.find]
include = ["loraai*"]

[tool.setuptools.package-data]
loraai = ["tui/*.tcss", "reports/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
